name: Tests

# Lint every PHP file and run the standalone unit tests (delete guard,
# encryption) on a disposable hosted runner, as its non-root user. The
# integration suites need Docker instances and run separately; see
# tests/README.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, zip

      - name: Lint
        run: |
          set -euo pipefail
          git ls-files '*.php' | grep -v '^vendor/' | while read -r f; do
            php -l "$f" > /dev/null
          done

      - name: Unit tests (non-root)
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          for t in tests/test-*.php; do
            echo "== $t"
            php "$t"
          done
