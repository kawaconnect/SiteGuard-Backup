name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from plugin header
        id: version
        run: echo "version=$(grep -oP 'Version:\s*\K[0-9.]+' siteguardbackup.php)" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir siteguardbackup
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            ./ siteguardbackup/
          zip -r "siteguardbackup-${{ steps.version.outputs.version }}.zip" siteguardbackup/

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: siteguardbackup-${{ steps.version.outputs.version }}
          path: siteguardbackup-*.zip
