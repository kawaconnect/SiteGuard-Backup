name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from plugin header
        id: version
        run: |
          VER=$(grep -oP 'Version:\s*\K[0-9.]+' siteguardbackup.php)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir siteguardbackup
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='docs/' \
            --exclude='tests/' \
            ./ siteguardbackup/
          zip -r "siteguardbackup-${{ steps.version.outputs.version }}.zip" siteguardbackup/

      - name: Create GitHub Release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          VER="${{ steps.version.outputs.version }}"
          # Use this version's CHANGELOG.md section as the notes when there is one.
          NOTES=$(awk -v v="## $VER" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then NOTES="Version $VER"; fi
          printf '%s\n\n%s\n' "$NOTES" "Commit ${{ github.sha }}" > release-notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "$COMMIT_MSG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            "siteguardbackup-${{ steps.version.outputs.version }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
